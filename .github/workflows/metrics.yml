name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Only re-run on pushes that change this workflow. A broad `push: main`
  # trigger would loop forever, because the action commits the rendered SVG
  # back to main using METRICS_TOKEN, which re-triggers the workflow.
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml

# A queued run should not race the in-flight one for the same commit target.
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        # Pinned: `@latest` is a moving tag and can break the profile silently.
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SRJ-ai
          template: classic
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_output: svg
          config_padding: 6%
          # Fail fast on a config error instead of burning 15 minutes on
          # three five-minute retries.
          retries: 2
          retries_delay: 30
          committer_message: "chore(metrics): update github-metrics.svg"

          base: header, activity, community, repositories

          # plugin_achievements and plugin_habits are left out deliberately.
          # achievements queries user.projects, and GitHub has removed classic
          # Projects, so that GraphQL call returns NOT_FOUND. habits crashes in
          # habits/index.mjs destructuring `author` from an undefined commit
          # payload entry. Both render "Unexpected error" into the card while
          # the workflow still reports success, because plugins_errors_fatal
          # defaults to false. Neither is fixed on master, and v3.34 is the
          # newest release.
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%



          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 15

          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4

          plugin_notable: yes
          plugin_notable_repositories: yes
