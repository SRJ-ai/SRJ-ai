name: Auto Commit

on:
  schedule:
    # Runs every day at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Make daily changes
        run: |
          mkdir -p dummy_code
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Generate ~40 commits
          for i in {1..40}
          do
            echo "Daily activity check: $(date) - commit $i" >> dummy_code/activity_log.txt
            git add dummy_code/activity_log.txt
            git commit -m "chore: automated daily activity check ($i/40)" || true
          done

      - name: Push changes
        run: git push
