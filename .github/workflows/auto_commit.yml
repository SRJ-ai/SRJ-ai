name: Auto Commit

on:
  schedule:
    # Runs every day at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Make a daily change
        run: |
          mkdir -p dummy_code
          echo "Daily activity check: $(date)" >> dummy_code/activity_log.txt

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dummy_code/activity_log.txt
          git commit -m "chore: automated daily activity check" || echo "No changes to commit"
          git push
